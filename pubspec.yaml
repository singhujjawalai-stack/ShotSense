name: shotsense
description: Your screenshots, understood - on-device OCR, smart retention, content search
version: 0.1.0+1
publish_to: 'none'
environment:
  sdk: '>=3.13.3 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: "ic_launcher"

flutter:
  uses-material-design: true
